<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>여행 플래너</title>
<meta name="theme-color" content="#2f6f6a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="app-header">
  <h1 id="trip-name">여행</h1>
  <div id="trip-sub" class="sub"></div>
  <button id="settings-btn" class="gear-btn" type="button" aria-label="설정" aria-pressed="false">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </button>
</header>

<section id="locked" class="locked" hidden>
  <h2 class="section-title">초대 링크가 필요해요</h2>
  <div class="panel">
    <p class="locked-text">이 여행은 초대 링크로만 열려요. 받은 링크로 다시 들어오거나, 링크(또는 키)를 아래에 붙여넣어 주세요.</p>
    <form id="locked-form">
      <input id="locked-input" class="input" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="초대 링크 또는 키">
      <div id="locked-msg" class="notice" role="alert"></div>
      <button class="btn primary block" type="submit">열기</button>
    </form>
  </div>
</section>

<main>
  <section id="tab-plan" class="tab">
    <div id="day-tabs" class="day-tabs"></div>
    <div class="day-head">
      <h2 id="day-title" class="section-title"></h2>
      <button id="route-btn" class="btn ghost small" type="button" hidden>전체 경로</button>
    </div>
    <div id="day-basis" class="basis" hidden></div>
    <div id="day-warn" class="warns" hidden></div>
    <ul id="day-items" class="list"></ul>
    <div id="day-empty" class="empty" hidden>이 날의 일정이 비어 있음</div>
    <div id="legs-credit" class="attrib credit" hidden>이동시간: Google Maps</div>
    <button id="add-item-btn" class="btn primary block" type="button">장소 추가</button>
  </section>

  <section id="tab-summary" class="tab" hidden>
    <div class="home-hero">
      <div id="home-dday" class="home-dday"></div>
      <div id="home-range" class="home-range"></div>
      <button id="home-plan-btn" class="btn primary block" type="button">일정 보러가기</button>
      <div id="home-days" class="home-days"></div>
    </div>
    <h2 class="section-title">항공편</h2>
    <div id="summary-flights"></div>
    <h2 class="section-title">숙소</h2>
    <div id="summary-lodgings"></div>
    <h2 class="section-title">내 정보</h2>
    <div class="panel">
      <button id="vault-btn-summary" class="btn block" type="button" style="margin-top:0">내 정보 보기 (예약번호, 주소 등)</button>
    </div>
  </section>

  <section id="tab-settings" class="tab" hidden>
    <h2 class="section-title">여행 날짜</h2>
    <div class="panel">
      <div id="trip-summary" class="summary"></div>
      <div id="trip-warns" class="warns"></div>
      <button id="dates-btn" class="btn ghost small block" type="button">날짜 직접 입력 (항공편이 없을 때)</button>
    </div>

    <div class="day-head sec-head">
      <h2 id="sec-flights" class="section-title">항공편</h2>
      <button id="vault-btn-flights" class="btn ghost small" type="button">내 정보</button>
    </div>
    <div id="flights-box"></div>

    <h2 id="sec-lodgings" class="section-title">숙소</h2>
    <div id="lodgings-box" class="panel"></div>

    <h2 class="section-title">초대</h2>
    <div class="panel">
      <button id="invite-btn" class="btn block" type="button" style="margin-top:0">초대 링크 복사</button>
      <button id="forget-key-btn" class="btn ghost small block" type="button">이 기기에서 키 지우기</button>
    </div>

    <h2 class="section-title">내 정보</h2>
    <div class="panel">
      <button id="vault-btn-settings" class="btn block" type="button" style="margin-top:0">내 정보 보기 (예약번호 등)</button>
    </div>

    <h2 class="section-title">데이터</h2>
    <div class="panel">
      <button id="export-btn" class="btn block" type="button" style="margin-top:0">JSON 내보내기</button>
      <button id="import-btn" class="btn block" type="button">JSON 가져오기</button>
      <a class="btn ghost small block" href="../archive/past.html">지난 기록 (여행지 투표 등)</a>
    </div>
  </section>
</main>

<nav class="tabbar">
  <button type="button" data-tab="summary" class="active">홈</button>
  <button type="button" data-tab="plan">일정</button>
</nav>

<div id="modal-root"></div>
<div id="toast" class="toast" hidden></div>

<script type="module" src="app.js"></script>
</body>
</html>
