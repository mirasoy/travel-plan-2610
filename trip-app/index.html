<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>여행 플래너</title>
<meta name="theme-color" content="#2f6f6a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="app-header">
  <h1 id="trip-name">여행</h1>
  <div id="trip-sub" class="sub"></div>
</header>

<main>
  <section id="tab-pool" class="tab">
    <div class="panel">
      <label class="label" for="paste">구글맵 공유 텍스트</label>
      <textarea id="paste" class="input" rows="4" placeholder="구글맵에서 공유한 텍스트를 붙여넣기"></textarea>
      <div class="label">카테고리 (선택)</div>
      <div id="cat-chips" class="chips"></div>
      <div class="row">
        <button id="clear-btn" class="btn ghost" type="button">지우기</button>
        <button id="save-btn" class="btn primary grow" type="button">저장</button>
      </div>
    </div>

    <h2 class="section-title">장소 <span id="pool-count"></span></h2>
    <ul id="pool-list" class="list"></ul>
    <div id="pool-empty" class="empty" hidden>저장된 장소가 없음</div>

    <section class="debug">
      <h2 class="section-title">공유 수신 디버그 (확인 후 제거 예정)</h2>
      <pre id="debug" class="debug-pre"></pre>
    </section>
  </section>

  <section id="tab-plan" class="tab" hidden>
    <div id="day-tabs" class="day-tabs"></div>
    <div class="day-head">
      <h2 id="day-title" class="section-title"></h2>
      <button id="dates-btn" class="btn ghost small" type="button">여행 기간</button>
    </div>
    <ul id="day-items" class="list"></ul>
    <div id="day-empty" class="empty" hidden>이 날의 일정이 비어 있음</div>
    <button id="add-item-btn" class="btn primary block" type="button">장소 추가</button>
  </section>
</main>

<nav class="tabbar">
  <button type="button" data-tab="pool" class="active">장소</button>
  <button type="button" data-tab="plan">일정</button>
</nav>

<div id="modal-root"></div>
<div id="toast" class="toast" hidden></div>

<script type="module" src="app.js"></script>
</body>
</html>
